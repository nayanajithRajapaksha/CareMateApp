server {
    listen 80;
    server_name _;

    # Serve the landing page
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Serve APK with correct MIME type for direct download
    location /download/ {
        alias /usr/share/nginx/html/;
        types {
            application/vnd.android.package-archive apk;
        }
        add_header Content-Disposition 'attachment; filename="CareMate.apk"';
    }
}
